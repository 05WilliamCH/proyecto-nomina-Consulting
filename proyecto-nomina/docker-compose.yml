services:
  db:
    image: postgres:17
    container_name: nomina_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomina_consulting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nomina_pgdata:/var/lib/postgresql/data
      # Postgres ejecuta automaticamente, en orden alfabetico, cualquier
      # .sql que encuentre aqui la PRIMERA vez que se crea el volumen.
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nomina_consulting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nomina_pgdata:
